name: CI/CD Pipeline & Evals Gate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-test-and-evals:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .[dev,evals]

      - name: Gate 1: Type Soundness (Mypy Strict)
        run: |
          mypy src/triage_agent

      - name: Gate 2: Code Quality (Ruff)
        run: |
          ruff check src/ tests/

      - name: Gate 3: Unit & Integration Invariants (Pytest)
        run: |
          pytest tests/ -v --durations=10

      - name: Gate 4: Production Evals & Invariant Gate
        run: |
          python -m triage_agent.evals.benchmark

      - name: Gate 5: Container Build Check
        run: |
          docker build -t enterprise-order-triage:ci .
