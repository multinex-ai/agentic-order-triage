[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fde-agentic-order-triage"
version = "1.0.0"
description = "Production Enterprise Order-Triage Agent with LangGraph/OpenAI, Databricks Medallion audit, Prometheus metrics, and Langfuse evals."
authors = [{ name = "Christopher Rijos", email = "rijos.christopher@gmail.com" }]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "prometheus-client>=0.20.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "mypy>=1.9.0",
    "ruff>=0.3.0",
]
evals = [
    "langfuse>=2.20.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/triage_agent"]

[tool.mypy]
strict = true
python_version = "3.12"
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["langfuse.*", "prometheus_client.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
